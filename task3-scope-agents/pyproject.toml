[project]
name = "scope-agents"
version = "0.1.0"
description = "Task 3: meeting transcripts -> scope of work, estimate, proposal"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "anthropic>=0.40"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["scope"]
